[build-system]
# MEASURED floor, not a guess: `project.license` as an SPDX *string* is PEP 639,
# which setuptools implements from 77. Built against setuptools 76.0.0 (which
# satisfied the previous `>=68` floor) and the build died with
#   ValueError: invalid pyproject.toml config: `project.license`.
# A floor that lies is worse than no floor: it turns into a stranger's
# "invalid pyproject.toml" instead of a version error.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────────────────────
# PEP 621: всё про метаданные — здесь. Старый setup.py не нужен и вреден:
# он раздваивает источник правды (имя, версия, зависимости живут в двух
# местах, и через полгода они расходятся).
# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "axiomrnn"
version = "0.2.0"
description = "Design networks for the memory budget you have: a pure-python planner, plus an extendable recurrent/spiking kernel with verified gradients"
readme = "README.md"
# Capped below 3.14, and the cap is measured rather than guessed.
#
# 0.1.0 declared ">=3.10" with tensorflow>=2.16 as a hard dependency, and that
# combination cannot install on Python 3.14: TensorFlow 2.21.0, the current
# stable, ships cp310-cp313 wheels only. The first 3.14 wheel appears in 2.22.0rc0,
# a release candidate. So on 3.14 pip reports
#
#   ERROR: Could not find a version that satisfies the requirement tensorflow>=2.16
#   (from versions: 2.22.0rc0)
#
# which reads like a broken package rather than an unsupported interpreter.
#
# The gate itself still runs its non-TensorFlow suites on 3.14, so 3.14 is a
# supported interpreter for the planner; it just cannot be one for this package
# while TensorFlow is a required dependency.
requires-python = ">=3.10,<3.14"
# SPDX-выражение вместо классификатора: классификатор License :: OSI
# Deprecated начиная с PEP 639, и сборка об этом предупреждает.
license = "Apache-2.0"
license-files = ["LICENSE"]
# Shown on the PyPI project page. Keep it in step with the LICENSE copyright
# line: an artifact whose two attributions disagree is worse than one with
# neither.
authors = [
    { name = "Cubetitled" },
]
maintainers = [
    { name = "Cubetitled" },
]
# "neuroscience" was here and was removed: the package does not model
# neuroscience. The neuron is a leaky integrator with a threshold -- an
# engineering abstraction, not Hodgkin-Huxley, with no ion channels.
keywords = [
    "spiking-neural-networks", "recurrent-neural-networks",
    "memory-planning", "keras", "tensorflow",
]
# "neuromorphic" was here and was removed for the same reason "neuroscience"
# was: `axiomrnn-explain` prints, under NOT measured, "energy: no neuromorphic
# device was used, ever". Advertising a keyword our own output disclaims is the
# kind of thing a stranger screenshots.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    # These five must stay a subset of `requires-python` above, which is
    # >=3.10,<3.14. The 3.14 classifier was here while the cap was not, so
    # the published wheel advertised an interpreter that pip then refused to
    # install on. PyPI classifiers are a claim; requires-python is the
    # contract. A classifier the resolver contradicts is worse than a missing
    # one, because it is the one a user reads before installing.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ─────────────────────────────────────────────────────────────────────────────
# ЯДРО — ТОЛЬКО ЧИСЛА.
#
# Это не украшение: axplan (память, планировщик, правила кредита, explain)
# не импортирует TensorFlow вообще. Проверяется фактом -- планировщик
# работает на машине без GPU-стека, и на нём же запускается examples/02.
# Поэтому требовать TF от того, кто хочет посчитать бюджет, — ошибка.
# ─────────────────────────────────────────────────────────────────────────────
dependencies = [
    "numpy>=1.24",
    # TensorFlow is required, not optional.
    #
    # It was an extra once, on the reasoning that the memory planner should stay
    # usable without a deep learning framework. That was true and it is still
    # true -- `import axiomrnn` works with numpy alone, and `axplan`/`axon` have
    # no TensorFlow dependency at all. But it made the default install a package
    # that could not do its main job: `pip install axiomrnn` gave you a working
    # spiking framework you could not build a single spiking layer with. The
    # planner kept working; everything else refused on first use.
    #
    # A framework whose headline feature needs a dependency should require that
    # dependency. Someone who only wants memory numbers can still import
    # `axplan` alone, and that is now documented as the supported light path.
    "tensorflow>=2.16",
]

[project.optional-dependencies]
# A CUDA-enabled TensorFlow. The CUDA version is chosen by TensorFlow, not here,
# so this extra only exists to say "give me the GPU build".
tf-gpu = [
    "tensorflow[and-cuda]>=2.16",
]
dev = [
    "pytest>=7.4",
]

# ─────────────────────────────────────────────────────────────────────────────
# ТОЧКА ВХОДА ОДНА.
#
# import axiomrnn as ax
#     ax.Model(...)        архитектура
#     ax.Budget(...)       бюджет памяти
#     ax.explain_budget(...)  «что ты можешь выучить»
#
# ax.explain DOES NOT EXIST -- measured on the installed wheel:
#   hasattr(ax, "explain") -> False;  hasattr(ax, "explain_budget") -> True
# The method form is m.explain(budget) on a Model. docs/DESIGN_LOG.md:776 still
# prints `ax.explain(net)`; that line is wrong and is not this file's to fix.
#
# axplan / axtf / axon — внутренние пакеты. Они доступны (для расширения),
# но документированный интерфейс — axiomrnn.
# ─────────────────────────────────────────────────────────────────────────────
[project.scripts]
axiomrnn-explain = "axiomrnn:main_explain"

# MEASURED against the shipped wheel, not against this file: the 0.1.1 METADATA
# carried all four of these as timatigoogl3-code/axiomrnn, which is the
# third-party account this environment's `gh` is authenticated as -- not the
# author's. `git remote -v` has always said cubetitled-ui. A wrong Source URL on
# a PyPI page sends every reader to somebody else's repository, and no test in
# this project can see it, because nothing compares these strings to the remote.
[project.urls]
Documentation = "https://github.com/cubetitled-ui/axiomrnn#readme"
Source = "https://github.com/cubetitled-ui/axiomrnn"
Issues = "https://github.com/cubetitled-ui/axiomrnn/issues"
Changelog = "https://github.com/cubetitled-ui/axiomrnn/blob/main/CHANGELOG.md"

# ─────────────────────────────────────────────────────────────────────────────
# УПАКОВКА.
#
# Flat layout, deliberately: axplan / axtf / axon sit next to each other and
# import as top-level. A move under src/ would break every sys.path insert in
# the examples and tests. Rule §9 of docs/UX_RULES.md: failures are owned,
# not dressed up as elegance.
# ─────────────────────────────────────────────────────────────────────────────
[tool.setuptools]
py-modules = ["axiomrnn"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["axplan*", "axtf*", "axon*", "backends*"]
exclude = ["tests*", "examples*", "docs*", "axcore*"]

[tool.setuptools.package-data]
"axtf" = ["*.md"]
# Shipped alongside the code so a checkout-free install still has the gate
# and the examples to run. sdist carries them via MANIFEST.in; these entries
# keep them in the wheel as package data where setuptools can attach them.
"tests" = ["*.py", "*.lock"]
"examples" = ["*.py", "*.txt", "*.md", "advanced/*.py"]

[tool.setuptools.data-files]
# Installed next to the interpreter so `pip install` from the sdist gives
# direct access to the gate and the examples.
"tests" = ["tests/*.py", "tests/*.lock"]
"examples" = ["examples/*.py", "examples/*.txt", "examples/*.md", "examples/advanced/*.py"]

# ─────────────────────────────────────────────────────────────────────────────
# ПАРАМЕТРЫ КАЧЕСТВА. Без них «проверено одной командой» ничего не значит.
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Предупреждения TF о наших собственных слоях -- НЕ ошибки. Но RuntimeWarning
# из compute_output_spec означает потерю формы, и её мы хотим видеть.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]